name: Python pytest (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use.
        required: false
        type: string
        default: "3.12"
      runner-label:
        description: Runner label used by the pytest job.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ${{ inputs.runner-label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install editable development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full pytest suite
        run: pytest -q
