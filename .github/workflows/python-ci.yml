name: Python pytest (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use.
        required: false
        type: string
        default: "3.12"
      runner-label:
        description: Runner label used by the pytest job.
        required: false
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: >-
          Minutes before the pytest job is killed. Without a limit a hung test bills the
          360-minute default. The slowest caller measured so far (2026-10-16) needs 3.2
          minutes, so the default leaves room for a cold pip cache and nothing more.
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install editable development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full pytest suite
        run: pytest -q
