name: Python pytest (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use.
        required: false
        type: string
        default: "3.12"
      runner-label:
        description: Runner label used by the pytest job.
        required: false
        type: string
        default: "ubuntu-latest"
      timeout-minutes:
        description: >-
          Minutes before the pytest job is killed. Without a limit a hung test bills the
          360-minute default. The slowest caller measured so far (2026-10-16) needs 3.2
          minutes, so the default leaves room for a cold pip cache and nothing more.
        required: false
        type: number
        default: 30

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The pip cache is for GitHub-hosted runners, which start empty. A self-hosted
      # runner already keeps its pip cache on disk between runs, and there `cache: pip`
      # uploads that runner user's whole ~/.cache/pip: 4.6 GB and 82 s per run on
      # vega-cli (2026-10-16), against a 10 GB repository cache limit.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: ${{ (startsWith(inputs.runner-label, 'ubuntu') || startsWith(inputs.runner-label, 'macos') || startsWith(inputs.runner-label, 'windows')) && 'pip' || '' }}
      - name: Install editable development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run full pytest suite
        run: pytest -q
