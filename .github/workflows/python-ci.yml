# Reusable Python CI Workflow
#
# book.md Art. V/VI compliance (2026-08-30, AGT-4135): this workflow previously could not
# fail. `pytest ... || true`, `continue-on-error` on ruff/black, `|| true` on bandit and
# mypy, and a `quality-gate` job that only printed a table meant a red run still produced
# a green check. Every one of those is gone.
#
# The rule now: whatever runs, blocks. A check a repository does not want is turned off
# through a declared input — a visible, recorded decision — never with `|| true`, which
# hides the same decision inside the log.
#
# Language checks only. The Articles themselves are enforced by constitution-gate.yml.
#
# Usage:
#   jobs:
#     ci:
#       uses: unohee/ci-templates/.github/workflows/python-ci.yml@main
#       with:
#         python-version: '3.12'
#         src-path: 'src/'
#       secrets: inherit

name: Python CI (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.12'
      lint-versions:
        description: >-
          Pinned lint toolchain. Unpinned, a ruff or black release turns an unrelated PR
          red on a rule nobody in this repo agreed to; that is the upstream-release
          failure ARCHITECTURE.md invariant 4 names. Bump deliberately.
        required: false
        type: string
        default: 'ruff==0.15.7 black==24.10.0 bandit[toml]==1.9.4'
      src-path:
        description: 'Source code directory'
        required: false
        type: string
        default: 'src/'
      test-path:
        description: 'Test directory'
        required: false
        type: string
        default: 'tests/unit/'
      coverage-threshold:
        description: 'Minimum coverage percentage'
        required: false
        type: number
        default: 0
      max-line-count:
        description: 'Maximum lines per file (raw line count). Art. III is enforced separately by constitution-gate.yml, which counts CODE lines against a 1500 ceiling with a 30-day clock; this is an optional stricter per-repo limit.'
        required: false
        type: number
        default: 800
      enable-fake-data-check:
        description: 'Enable fake data pattern detection'
        required: false
        type: boolean
        default: true
      feature-patterns:
        description: 'Feature variable patterns to check (comma-separated)'
        required: false
        type: string
        default: 'feature,program,arbitrage'
      strict-fake-data:
        description: 'Treat warnings as errors for fake data check'
        required: false
        type: boolean
        default: false
      enforce-types:
        description: 'Run mypy as a blocking check. Turn off deliberately, in the caller, if the repo has not adopted typing yet — do not neuter the step.'
        required: false
        type: boolean
        default: true
      enforce-security:
        description: 'Run bandit as a blocking check.'
        required: false
        type: boolean
        default: true

jobs:
  fake-data-check:
    name: Fake Data Detection
    runs-on: ubuntu-latest
    if: ${{ inputs.enable-fake-data-check }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout ci-templates
        uses: actions/checkout@v4
        with:
          repository: unohee/ci-templates
          path: .ci-templates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Run Fake Data Detector
        env:
          FAKE_DATA_FEATURE_PATTERNS: ${{ inputs.feature-patterns }}
        run: |
          if [ "${{ inputs.strict-fake-data }}" = "true" ]; then
            python .ci-templates/scripts/fake_data_detector.py ${{ inputs.src-path }} --ci --strict
          else
            python .ci-templates/scripts/fake_data_detector.py ${{ inputs.src-path }} --ci
          fi

      - name: Check np.random in feature code
        run: |
          echo "🔍 Checking for np.random in feature generation..."
          FAILED=0

          # Convert feature patterns to grep pattern
          PATTERNS="${{ inputs.feature-patterns }}"
          GREP_PATTERN=$(echo "$PATTERNS" | tr ',' '|')

          if [ -d "${{ inputs.src-path }}" ]; then
            # Exclude test files and comments
            if grep -rn "np\.random\.\(rand\|randn\|uniform\|normal\)" "${{ inputs.src-path }}" \
               --include="*.py" \
               --exclude-dir="__pycache__" \
               --exclude="*test*.py" 2>/dev/null | \
               grep -v "#" | \
               grep -v "seed" | \
               grep -v "random_state" | \
               grep -E "($GREP_PATTERN)" 2>/dev/null; then
              echo "::error::Found np.random usage in feature generation code"
              FAILED=1
            fi
          fi

          if [ $FAILED -eq 1 ]; then
            echo "❌ Fake data patterns detected!"
            echo "Please use real API data instead of np.random for features."
            exit 1
          else
            echo "✅ No fake data patterns found"
          fi

      - name: Cleanup
        if: always()
        run: rm -rf .ci-templates

  lint:
    name: Code Quality (Lint & Format)
    runs-on: ubuntu-latest
    needs: [fake-data-check]
    if: always() && (needs.fake-data-check.result == 'success' || needs.fake-data-check.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ${{ inputs.lint-versions }}

      - name: Run Ruff linter
        run: |
          ruff check ${{ inputs.src-path }} --output-format=github

      - name: Run Black formatter check
        run: |
          black --check --diff ${{ inputs.src-path }}

      - name: Run Bandit security check
        if: ${{ inputs.enforce-security }}
        run: |
          bandit -r ${{ inputs.src-path }} -ll

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov pytest-asyncio pytest-mock pytest-timeout

      - name: Run tests with coverage
        id: pytest
        run: |
          # pipefail so the pipe into tee cannot mask a failing pytest. Without it the
          # step reports tee's status and a red suite ships green.
          set -o pipefail
          pytest ${{ inputs.test-path }} \
            --cov=${{ inputs.src-path }} \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-report=json \
            --cov-fail-under=${{ inputs.coverage-threshold }} \
            --tb=short \
            --timeout=60 \
            -q \
            2>&1 | tee pytest_output.txt

          PASSED=$(grep -oP '\d+(?= passed)' pytest_output.txt | tail -1 || echo "0")
          FAILED=$(grep -oP '\d+(?= failed)' pytest_output.txt | tail -1 || echo "0")
          SKIPPED=$(grep -oP '\d+(?= skipped)' pytest_output.txt | tail -1 || echo "0")

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Extract coverage percentage
        if: always()
        id: coverage
        run: |
          if [ -f coverage.json ]; then
            COVERAGE=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'], 1))")
            echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "percentage=0" >> $GITHUB_OUTPUT
          fi

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | ${{ steps.pytest.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${{ steps.pytest.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | ${{ steps.pytest.outputs.skipped }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ steps.coverage.outputs.percentage }}% |" >> $GITHUB_STEP_SUMMARY

  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests types-PyYAML
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run mypy
        if: ${{ inputs.enforce-types }}
        run: |
          mypy ${{ inputs.src-path }} --ignore-missing-imports --no-strict-optional

  loc-gate:
    name: LOC Gate (Max ${{ inputs.max-line-count }} lines)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file line counts
        run: |
          echo "### LOC Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for file in $(find ${{ inputs.src-path }} -name "*.py" -type f); do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt ${{ inputs.max-line-count }} ]; then
              echo "| $file | $lines | FAIL |" >> $GITHUB_STEP_SUMMARY
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Files exceed ${{ inputs.max-line-count }} line limit"
            exit 1
          fi

          echo "All files under ${{ inputs.max-line-count }} lines" >> $GITHUB_STEP_SUMMARY

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [fake-data-check, lint, test, type-check, loc-gate]
    if: always()

    steps:
      - name: Quality summary
        # book.md Art. VI — this job used to print the table below and exit 0 regardless,
        # so `needs` failing changed nothing a required check could see. Anything that is
        # not `success` (including skipped and cancelled) now fails the build.
        run: |
          set -uo pipefail
          fail=0
          {
            echo "### Quality Gate Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          check() {
            echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$2" != "success" ]; then
              echo "::error::$1 did not pass (result: $2). book.md Art. VI — a gate that did not run has not passed."
              fail=1
            fi
          }

          # A job gated on a declared input may legitimately be `skipped`: that is the
          # caller switching it off in the open, which book.md Art. VI allows. A job that
          # is enabled and skipped anyway was blocked by something upstream, and that is
          # a failure. The distinction is the input, so it is read here rather than
          # assumed from the result.
          optional() {
            if [ "$3" != "true" ]; then
              echo "| $1 | disabled in caller |" >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            check "$1" "$2"
          }

          optional "Fake Data" "${{ needs.fake-data-check.result }}" "${{ inputs.enable-fake-data-check }}"
          check    "Lint"       "${{ needs.lint.result }}"
          check    "Tests"      "${{ needs.test.result }}"
          check    "Type Check" "${{ needs.type-check.result }}"
          check    "LOC Gate"   "${{ needs.loc-gate.result }}"

          if [ "${{ inputs.coverage-threshold }}" = "0" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Coverage threshold is 0 — no coverage floor is being enforced. Art. V: set it to the repo's measured floor." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $fail
