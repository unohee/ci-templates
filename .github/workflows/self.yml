# ci-templates runs its own constitution gate.
#
# Without this file the gates could be changed and merged without GitHub Actions ever
# executing them — the templates would enforce book.md everywhere except where they are
# written. Review caught exactly that: both other workflows here declare `workflow_call`
# only, so nothing in this repository triggered them.
#
# `gates-ref` follows the branch under test, so a pull request is judged by the gates it
# proposes rather than by the ones already on main.

name: Self

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only a pull request is cancelled when a newer commit arrives: its run reads base..head,
# so the newer run sees everything the older one did. A push is judged on before..head, and
# a concurrency group keeps one running and ONE pending run — a newer push replaces the
# pending one, so its before..head range would never be checked by anything. Pushes
# therefore get a group per commit and never wait on, or replace, each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  constitution:
    uses: ./.github/workflows/constitution-gate.yml
    with:
      gates-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # rust-ci.yml's classifier is the one piece of it that can make a caller's CI do less, and
  # its wiring tests pin the one-job shape. Nothing else here would run them.
  rust-ci-tests:
    name: 'rust-ci classifier and wiring tests'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I scripts/test_ci_changes.py
