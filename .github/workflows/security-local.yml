# Reusable local security gate: secrets, static analysis and dependencies, without any paid
# GitHub feature.
#
# Why this exists: GitHub Advanced Security (code scanning, secret scanning) and GitHub Code
# Quality are dropped on 2026-11-20 for cost. The tools this workflow runs are free for private
# commercial use and run on our own runners, so the gate costs nothing and by construction cannot
# depend on a repository's Advanced Security setting. See ci-templates/security/README.md.
#
# The caller keeps this job out of `needs:` of anything else unless it wants to block on it; it is
# meant to be a required check on the default branch.
#
# Profile:
#   pull_request -> --profile pr:   the BASE..HEAD range for secrets, only the changed files for
#                                   static analysis. Fast, and nothing else can fail the run.
#   anything else -> --profile full: the whole history and the whole tracked tree. This is the
#                                   run that catches what a pull request never touched.
#
# `range` narrows the full profile to one push's commits ("before..after"). An unmeasurable range
# falls back to every commit on the checked-out ref, never to a shorter list. `report-only` keeps a
# finding from failing the job, for the scheduled whole-history audit (AUD-3008 follow-up).
#
# tools-ref: the ci-templates ref holding security/. It follows the branch under test on a pull
# request, so a change to a rule is judged by the rules it proposes (same idea as self.yml's
# gates-ref).

name: Security (local gate)

on:
  workflow_call:
    inputs:
      profile:
        description: 'pr (changed files) or full (whole history and tree)'
        type: string
        default: pr
      base-ref:
        description: 'commit the pull-request range is measured from'
        type: string
        default: origin/main
      range:
        description: >-
          Optional commit range for the full profile, "<before>..<after>". A push passes
          github.event.before..github.sha so the scan reads only the commits that push introduced;
          an unmeasurable range (new branch, dropped tip) falls back to every commit on the ref.
        type: string
        default: ''
      report-only:
        description: >-
          Report findings without failing the job. For the weekly whole-history audit, which must
          tell people what is old without blocking a merge.
        type: boolean
        default: false
      tools-ref:
        description: 'ci-templates ref holding security/'
        type: string
        default: main
      quality:
        description: 'also write the report-only complexity and copy/paste metrics'
        type: boolean
        default: false
      runs-on:
        description: 'runner label; vela-linux carries the toolchain'
        type: string
        default: vela-linux

permissions:
  contents: read

jobs:
  scan:
    name: 'security: secrets, sast, dependencies'
    runs-on: ${{ inputs.runs-on }}
    # Measured 2026-11-20 on vela-linux: gitleaks over de-artifact's full history 12 s, semgrep
    # over the tracked tree 6 min, osv-scanner 20 s. 30 minutes leaves room for a cold semgrep
    # rule cache without turning a hang into a silent pass.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The secret pass reads history (`--all` on a push, BASE..HEAD on a pull request).
          fetch-depth: 0

      - name: Check out the gate scripts
        uses: actions/checkout@v7
        with:
          repository: unohee/ci-templates
          ref: ${{ inputs.tools-ref }}
          path: .ci-templates

      - name: Fetch the base commit
        if: inputs.profile == 'pr'
        # Never `--depth=1` here. A shallow fetch grafts the base tip, which cuts its ancestors,
        # and `git merge-base` then reports "no merge base" for every branch that is behind the
        # base — so the gate dies on a git error instead of reporting a finding (AUD-3071). The
        # base is one branch and the checkout above is already full, so fetching it whole is cheap.
        run: bash .ci-templates/security/fetch_base.sh "${{ inputs.base-ref }}"

      - name: Install the pinned scanners
        env:
          SECURITY_TOOLS_DIR: ${{ runner.temp }}/security-tools
        run: bash .ci-templates/security/bootstrap.sh

      - name: Scan
        id: scan
        env:
          SECURITY_TOOLS_DIR: ${{ runner.temp }}/security-tools
        run: |
          set -o pipefail
          args=(--repo . --profile "${{ inputs.profile }}" --out "$RUNNER_TEMP/security-summary.json")
          [ "${{ inputs.profile }}" = pr ] && args+=(--base "${{ inputs.base-ref }}")
          [ -n "${{ inputs.range }}" ] && args+=(--range "${{ inputs.range }}")
          [ "${{ inputs.quality }}" = true ] && args+=(--quality)
          set +e
          bash .ci-templates/security/scan.sh "${args[@]}"
          status=$?
          set -e
          if [ "$status" = 0 ]; then
            exit 0
          fi
          # A report-only run never fails: it exists to show what old history still holds, not to
          # hold a merge. A tooling failure (2) is still a failure whatever the mode, because a
          # scanner that could not run must never read as a clean scan.
          if [ "${{ inputs.report-only }}" = true ] && [ "$status" = 1 ]; then
            echo "report-only: blocking findings above did not fail this run"
            exit 0
          fi
          exit "$status"

      - name: Write the finding list into the run summary
        if: always() && inputs.report-only
        run: |
          f="$RUNNER_TEMP/security-summary.json"
          [ -f "$f" ] || { echo "No summary was written; the scan did not reach its gate." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 .ci-templates/security/report_summary.py "$f" >> "$GITHUB_STEP_SUMMARY" \
            || echo "The summary could not be rendered; see the security-summary artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the finding summary
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-summary
          path: ${{ runner.temp }}/security-summary.json
          if-no-files-found: ignore
          retention-days: 14
